name: Build and Push Images

# Publishing: ONLY an X.Y.Z tag push or a manual dispatch pushes images, and
# every publish re-tags :latest for base, rust and rust-leptos. Merging to main
# publishes nothing. A pull request that touches an image builds all three and
# runs the smoke test, but never logs in or pushes.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - 'base/**'
      - 'rust/**'
      - 'rust-leptos/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0). Leave empty for "latest"'
        required: false
        default: ''
      tz:
        description: 'Timezone (TZ)'
        required: false
        default: ''
      claude_code_version:
        description: 'Claude Code version'
        required: false
        default: 'latest'
      gh_version:
        description: 'GitHub CLI version'
        required: false
        default: '2.98.0'
      git_delta_version:
        description: 'git-delta version'
        required: false
        default: '0.19.2'
      zsh_in_docker_version:
        description: 'zsh-in-docker version'
        required: false
        default: '1.2.1'
      zellij_version:
        description: 'zellij version'
        required: false
        default: '0.45.1'
      leptos_version:
        description: 'leptos crate version (exposed as LEPTOS_VERSION in the rust-leptos image)'
        required: false
        default: '0.8.22'
      cargo_leptos_version:
        description: 'cargo-leptos CLI version'
        required: false
        default: '0.3.11'
      nextest_version:
        description: 'cargo-nextest version'
        required: false
        default: '0.9.143'

env:
  REGISTRY: ghcr.io
  NAMESPACE: jcttech
  # `inputs` is empty on the tag-push and pull_request triggers, so these fall
  # back to the same values as the workflow_dispatch defaults (and the
  # Dockerfile ARG defaults -- keep all three in step) rather than passing
  # empty --build-arg values that would override the Dockerfile defaults.
  TZ_ARG: ${{ inputs.tz || 'UTC' }}
  CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version || 'latest' }}
  GH_VERSION: ${{ inputs.gh_version || '2.98.0' }}
  GIT_DELTA_VERSION: ${{ inputs.git_delta_version || '0.19.2' }}
  ZSH_IN_DOCKER_VERSION: ${{ inputs.zsh_in_docker_version || '1.2.1' }}
  ZELLIJ_VERSION: ${{ inputs.zellij_version || '0.45.1' }}
  LEPTOS_VERSION: ${{ inputs.leptos_version || '0.8.22' }}
  CARGO_LEPTOS_VERSION: ${{ inputs.cargo_leptos_version || '0.3.11' }}
  NEXTEST_VERSION: ${{ inputs.nextest_version || '0.9.143' }}
  # 'false' on a pull request: build and smoke-test, push nothing.
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.number }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push base
        run: |
          podman build \
                       --build-arg TZ="${TZ_ARG}" \
                       --build-arg CLAUDE_CODE_VERSION="${CLAUDE_CODE_VERSION}" \
                       --build-arg GH_VERSION="${GH_VERSION}" \
                       --build-arg GIT_DELTA_VERSION="${GIT_DELTA_VERSION}" \
                       --build-arg ZSH_IN_DOCKER_VERSION="${ZSH_IN_DOCKER_VERSION}" \
                       --build-arg ZELLIJ_VERSION="${ZELLIJ_VERSION}" \
                       -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-base:${{ steps.version.outputs.version }} \
                       -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-base:latest \
                       ./base
          if [ "${PUBLISH}" = "true" ]; then
            podman push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-base:${{ steps.version.outputs.version }}
            podman push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-base:latest
          fi

      - name: Build and push rust
        run: |
          podman build --build-arg REGISTRY=${{ env.REGISTRY }} \
                       --build-arg NAMESPACE=${{ env.NAMESPACE }} \
                       --build-arg BASE_VERSION=${{ steps.version.outputs.version }} \
                       --build-arg NEXTEST_VERSION="${NEXTEST_VERSION}" \
                       -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-rust:${{ steps.version.outputs.version }} \
                       -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-rust:latest \
                       ./rust
          if [ "${PUBLISH}" = "true" ]; then
            podman push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-rust:${{ steps.version.outputs.version }}
            podman push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-rust:latest
          fi

      - name: Build rust-leptos
        run: |
          podman build --build-arg REGISTRY=${{ env.REGISTRY }} \
                       --build-arg NAMESPACE=${{ env.NAMESPACE }} \
                       --build-arg BASE_VERSION=${{ steps.version.outputs.version }} \
                       --build-arg LEPTOS_VERSION="${LEPTOS_VERSION}" \
                       --build-arg CARGO_LEPTOS_VERSION="${CARGO_LEPTOS_VERSION}" \
                       -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-rust-leptos:${{ steps.version.outputs.version }} \
                       -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-rust-leptos:latest \
                       ./rust-leptos

      - name: Smoke test rust-leptos (tool versions)
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-rust-leptos:${{ steps.version.outputs.version }}"
          # The pins that live only in the Dockerfile are read from it, so the
          # expectations here can never drift from what the image installs.
          arg_default() { sed -n "s/^ARG $1=//p" rust-leptos/Dockerfile; }
          WASM_BINDGEN_VERSION="$(arg_default WASM_BINDGEN_VERSION)"
          BINARYEN_VERSION="$(arg_default BINARYEN_VERSION)"
          CHROME_VERSION="$(arg_default CHROME_VERSION)"
          for v in "${WASM_BINDGEN_VERSION}" "${BINARYEN_VERSION}" "${CHROME_VERSION}"; do
            [ -n "$v" ] || { echo "::error::an ARG default is missing from rust-leptos/Dockerfile"; exit 1; }
          done
          echo "::group::cargo-leptos --version (expect ${CARGO_LEPTOS_VERSION})"
          podman run --rm "${IMAGE}" cargo-leptos --version | grep -F "${CARGO_LEPTOS_VERSION}"
          echo "::endgroup::"
          echo "::group::LEPTOS_VERSION env (expect ${LEPTOS_VERSION})"
          podman run --rm "${IMAGE}" printenv LEPTOS_VERSION | grep -Fx "${LEPTOS_VERSION}"
          echo "::endgroup::"
          echo "::group::wasm-bindgen --version (expect ${WASM_BINDGEN_VERSION})"
          podman run --rm "${IMAGE}" wasm-bindgen --version | grep -Fx "wasm-bindgen ${WASM_BINDGEN_VERSION}"
          echo "::endgroup::"
          echo "::group::wasm-opt --version (expect ${BINARYEN_VERSION})"
          podman run --rm "${IMAGE}" wasm-opt --version | grep -F "(${BINARYEN_VERSION})"
          echo "::endgroup::"
          # Chrome for Testing is baked on amd64 only (this runner); the pair
          # comes from one CfT version directory, so both must print the ARG.
          echo "::group::google-chrome --version (expect ${CHROME_VERSION})"
          podman run --rm "${IMAGE}" google-chrome --version | grep -F "Google Chrome for Testing ${CHROME_VERSION}"
          echo "::endgroup::"
          echo "::group::chromedriver --version (expect ${CHROME_VERSION})"
          podman run --rm "${IMAGE}" chromedriver --version | grep -F "ChromeDriver ${CHROME_VERSION} "
          echo "::endgroup::"
          echo "::group::headless page load (the runtime libs are all there)"
          podman run --rm "${IMAGE}" google-chrome --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --dump-dom 'data:text/html,<p>cft-smoke-ok</p>' \
            | grep -F '<p>cft-smoke-ok</p>'
          echo "::endgroup::"
          echo "::group::psql --version"
          podman run --rm "${IMAGE}" psql --version
          echo "::endgroup::"
          echo "::group::jq --version"
          podman run --rm "${IMAGE}" jq --version
          echo "::endgroup::"
          echo "::group::wasm32 target installed"
          podman run --rm "${IMAGE}" rustup target list --installed | grep -F 'wasm32-unknown-unknown'
          echo "::endgroup::"
          echo "::group::cargo-nextest --version (expect ${NEXTEST_VERSION})"
          podman run --rm "${IMAGE}" cargo-nextest --version | grep -F "${NEXTEST_VERSION}"
          echo "::endgroup::"

      - name: Push rust-leptos
        if: env.PUBLISH == 'true'
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-rust-leptos:${{ steps.version.outputs.version }}
          podman push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/devcontainer-rust-leptos:latest
